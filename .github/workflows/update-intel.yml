name: CTF Atlas intelligence refresh

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh intelligence snapshot
        run: node scripts/update-intel.mjs
      - name: Commit changed snapshot
        run: |
          git config user.name "ctf-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-intel.json
          if git diff --cached --quiet; then
            echo "No intelligence changes"
          else
            git commit -m "chore: refresh security intelligence"
            git push
          fi
